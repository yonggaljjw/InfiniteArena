# 역할: 개발용 Compose 덮어쓰기. 소스 마운트/자동 재시작과 Vite를 사용하며 기본 compose.yaml과 함께 실행합니다.
# docker compose -f compose.yaml -f compose.dev.yaml up --build
services:
  backend:
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --ws-max-size 2048"
  frontend:
    build:
      context: ./frontend
      target: build
    command: npm run dev -- --host 0.0.0.0 --port 80
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    environment:
      API_PROXY_TARGET: http://backend:8000
volumes:
  frontend_modules:
